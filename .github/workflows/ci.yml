name: Build next.js with its dependencies

env:
  DEBUG: "napi:*"
  RUST_BACKTRACE: full
  # https://github.com/nodejs/node/issues/51555#issuecomment-2290742072
  DISABLE_V8_COMPILE_CACHE: 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"

jobs:
  build:
    env:
      NEXT_JS_REF: "v16.0.3"
      SWC_REF: "v1.11.24"
      TURBO_REF: "v2.5.5"
      DEBUG: "napi:*"
      RUSTUP_TOOLCHAIN: nightly-x86_64-pc-windows-gnu
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
    strategy:
      fail-fast: false
      matrix:
        sys: [UCRT64]
    runs-on: ${{ matrix.sys == 'CLANGARM64' && 'windows-11-arm' || 'windows-latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: false
          install: >-
            git
            curl
          pacboy: >-
            toolchain:p
            cmake:p
            rustup:p
            nodejs:p
            protobuf:p
            canpnproto:p
            ${{ (matrix.sys == 'CLANG64' || matrix.sys == 'CLANGARM64') && 'gcc-compat:p' || '' }}

      - name: Show working directory (Windows)
        shell: pwsh
        run: |
          Get-Location
          ls

      - name: Echo System Info
        shell: msys2 {0}
        run: |
          echo "MSYSTEM = $MSYSTEM"
          uname -a
          pacman -Q msys2-runtime || true
          pwd

      - name: Install Rust stable and locate rustc
        shell: msys2 {0}
        run: |
          # NOTE: for clang64 or clangarm64, use -gnullvm
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup toolchain install nightly-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain nightly-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup show
          echo "=== installed targets ==="
          rustup target list --installed
          rustc_path="$(command -v rustc || true)"
          echo "rustc found at: ${rustc_path:-<not-found>}"
          if [ -n "$rustc_path" ]; then
            ls -l "$rustc_path"
            rustc -Vv || true
            rustc +nightly-x86_64-pc-windows-gnu -Vv || true
          else
            for prefix in /mingw64/bin /ucrt64/bin /clang64/bin /clangarm64/bin; do
              [ -d "$prefix" ] || continue
              echo "Listing rust binaries under $prefix"
              ls -la "$prefix" | grep rust || true
            done
          fi

      - name: Setup node
        shell: msys2 {0}
        run: |
          corepack enable

      - name: Clone swc, turbo
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch $SWC_REF https://github.com/swc-project/swc
          git clone --depth 1 --branch $TURBO_REF https://github.com/vercel/turborepo

      - name: Restore cargo registry cache
        id: cargo-registry-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-registry-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Restore cargo target cache
        id: cargo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: swc/bindings/target
          key: cargo-target-swc-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('swc/Cargo.lock') }}
          restore-keys: |
            cargo-target-swc-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-target-swc-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Restore yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v4
        with:
          path: swc/.yarn/cache
          key: swc-yarn-cache-${{ matrix.sys }}-${{ hashFiles('swc/yarn.lock') }}

      - name: Restore turbo target cache
        id: turbo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: turborepo/target
          key: cargo-target-turbo-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('turborepo/Cargo.lock') }}
          restore-keys: |
            cargo-target-turbo-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-target-turbo-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install dependencies
        shell: msys2 {0}
        working-directory: swc
        run: |
          yarn install

      - name: Save yarn cache
        if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: swc/.yarn/cache
          key: swc-yarn-cache-${{ matrix.sys }}-${{ hashFiles('swc/yarn.lock') }}

      - name: Build swc
        shell: msys2 {0}
        working-directory: swc
        env:
          RUSTUP_TOOLCHAIN: nightly-x86_64-pc-windows-gnu
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
        run: |
          export CARGO_PROFILE_RELEASE_LTO=false
          yarn build --target x86_64-pc-windows-gnu

      - name: Build turbo
        shell: msys2 {0}
        working-directory: turborepo
        run: |
          cargo build --profile release-turborepo -p turbo --target x86_64-pc-windows-gnu

      - name: Save cargo registry cache
        if: ${{ steps.cargo-registry-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cargo target cache
        if: ${{ steps.cargo-target-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: swc/bindings/target
          key: cargo-target-swc-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('swc/Cargo.lock') }}

      - name: Save turbo target cache
        if: ${{ steps.turbo-target-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: turborepo/target
          key: cargo-target-turbo-${{ matrix.sys }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('turborepo/Cargo.lock') }}
