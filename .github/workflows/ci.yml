name: Build next.js with its dependencies

env:
  DEBUG: "napi:*"
  RUST_BACKTRACE: full
  # https://github.com/nodejs/node/issues/51555#issuecomment-2290742072
  DISABLE_V8_COMPILE_CACHE: 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"

jobs:
  build:
    env:
      NEXT_JS_REF: "v16.0.3"
      SWC_REF: "v1.11.24"
      TURBO_REF: "v2.5.5"
      DEBUG: "napi:*"
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
      PNPM_CONFIG_IGNORE_SCRIPTS: "true"
      PNPM_CONFIG_IGNORE_PNPMFILE: "true"
    strategy:
      fail-fast: false
      matrix:
        sys: [UCRT64]
    runs-on: ${{ matrix.sys == 'CLANGARM64' && 'windows-11-arm' || 'windows-latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: false
          install: >-
            git
            curl
          pacboy: >-
            toolchain:p
            cmake:p
            rustup:p
            nodejs:p
            protobuf:p
            capnproto:p
            ${{ (matrix.sys == 'CLANG64' || matrix.sys == 'CLANGARM64') && 'gcc-compat:p' || '' }}

      - name: Show working directory (Windows)
        shell: pwsh
        run: |
          Get-Location
          ls

      - name: Echo System Info
        shell: msys2 {0}
        run: |
          echo "MSYSTEM = $MSYSTEM"
          uname -a
          pacman -Q msys2-runtime || true
          pwd

      - name: Install Rust stable and locate rustc
        shell: msys2 {0}
        run: |
          # NOTE: for clang64 or clangarm64, use -gnullvm
          rustup set default-host x86_64-pc-windows-gnu
          echo "=== installed targets ==="
          rustup target list --installed
          rustc_path="$(command -v rustc || true)"
          echo "rustc found at: ${rustc_path:-<not-found>}"
          if [ -n "$rustc_path" ]; then
            ls -l "$rustc_path"
            rustc -Vv || true
            rustc +nightly-x86_64-pc-windows-gnu -Vv || true
          else
            for prefix in /mingw64/bin /ucrt64/bin /clang64/bin /clangarm64/bin; do
              [ -d "$prefix" ] || continue
              echo "Listing rust binaries under $prefix"
              ls -la "$prefix" | grep rust || true
            done
          fi

      - name: Setup node
        shell: msys2 {0}
        run: |
          corepack enable

      - name: Determine pnpm store path
        shell: msys2 {0}
        run: |
          PNPM_STORE_PATH="$(pnpm store path)"
          echo "PNPM_STORE_PATH=${PNPM_STORE_PATH}" >> "$GITHUB_ENV"
          echo "pnpm store path: ${PNPM_STORE_PATH}"

      - name: Clone swc, turbo and next.js
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch $SWC_REF https://github.com/swc-project/swc
          git clone --depth 1 --branch $TURBO_REF https://github.com/vercel/turborepo
          git clone --depth 1 --branch $NEXT_JS_REF https://github.com/vercel/next.js

      - name: Restore cargo registry cache
        id: cargo-registry-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-registry-${{ matrix.sys }}-

      - name: Restore swc target cache
        id: cargo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: swc/bindings/target
          key: cargo-target-swc-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('swc/Cargo.lock') }}
          restore-keys: |
            cargo-target-swc-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-target-swc-${{ matrix.sys }}-

      - name: Restore yarn cache
        id: yarn-cache
        uses: actions/cache/restore@v4
        with:
          path: swc/.yarn/cache
          key: swc-yarn-cache-${{ matrix.sys }}-${{ hashFiles('swc/yarn.lock') }}

      - name: Restore turbo target cache
        id: turbo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: turborepo/target
          key: cargo-target-turbo-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('turborepo/Cargo.lock') }}
          restore-keys: |
            cargo-target-turbo-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-target-turbo-${{ matrix.sys }}-

      - name: Restore next.js cargo target cache
        id: next-target-cache
        uses: actions/cache/restore@v4
        with:
          path: next.js/target
          key: cargo-target-next-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('next.js/Cargo.lock') }}
          restore-keys: |
            cargo-target-next-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-
            cargo-target-next-${{ matrix.sys }}-

      - name: Restore pnpm store
        id: pnpm-store-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ matrix.sys }}-${{ hashFiles('next.js/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ matrix.sys }}-

      - name: Install dependencies
        shell: msys2 {0}
        working-directory: swc
        run: |
          yarn install --frozen-lockfile

      - name: Save yarn cache
        if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: swc/.yarn/cache
          key: swc-yarn-cache-${{ matrix.sys }}-${{ hashFiles('swc/yarn.lock') }}

      - name: Build swc
        shell: msys2 {0}
        working-directory: swc
        run: |
          export CARGO_PROFILE_RELEASE_LTO=false
          yarn build --target x86_64-pc-windows-gnu

      - name: Build turbo
        shell: msys2 {0}
        working-directory: turborepo
        run: |
          # show version and rust toolchain
          git rev-parse HEAD
          rustc -Vv
          rustup show active-toolchain
          cargo build --profile release-turborepo -p turbo --target x86_64-pc-windows-gnu

      - name: Inspect pnpm config and dump env related to npm/pnpm
        shell: msys2 {0}
        working-directory: next.js
        run: |
          which pnpm
          pnpm --version
          echo "=== pnpm config list ==="
          pnpm config list
          env | grep -i 'pnpm\|npm' || echo "no pnpm/npm-specific env vars"

      - name: Debug pnpm install (check for lifecycle scripts)
        shell: msys2 {0}
        working-directory: next.js
        run: |
          pnpm install --ignore-scripts --frozen-lockfile --reporter ndjson > pnpm-install-log.jsonl
          echo "=== Any lifecycle events? ==="
          grep -i 'Running .*script' pnpm-install-log.jsonl || echo "No lifecycle scripts reported."

      - name: Build next.js
        shell: msys2 {0}
        working-directory: next.js
        run: |
          # try with the latest next-9 pnpm to see whether `--ignore-scripts` works
          git apply ../nextjs.package.json.patch
          # use --ignore-scripts to bypass the postinstall scripts, these scripts will invoke
          # the native addons, but currently only -msvc versions are provided, but they cannot
          # be used on msys2 platforms
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm add -w @napi-rs/cli@2.18.4 turbo@2.5.5 --ignore-scripts
          # HACK
          cp ../swc/packages/core/swc.win32-x64-gnu.node node_modules/.pnpm/@swc+core-win32-x64-msvc@1.11.24/node_modules/@swc/core-win32-x64-msvc/swc.win32-x64-msvc.node
          cp ../turborepo/target/x86_64-pc-windows-gnu/release-turborepo/turbo.exe node_modules/.pnpm/turbo-windows-64@2.5.5/node_modules/turbo-windows-64/bin/turbo.exe
          # with these two binaries replaced, we can call turbo
          npx turbo run build-native-release -vvv --env-mode loose --remote-cache-timeout 90 --summarize -- --target x86_64-pc-windows-gnu
          # HACK restore pnpm-lock.yaml for caching
          git checkout pnpm-lock.yaml

      - name: Save cargo registry cache
        if: ${{ steps.cargo-registry-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cargo target cache
        if: ${{ steps.cargo-target-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: swc/bindings/target
          key: cargo-target-swc-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('swc/Cargo.lock') }}

      - name: Save turbo target cache
        if: ${{ steps.turbo-target-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: turborepo/target
          key: cargo-target-turbo-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('turborepo/Cargo.lock') }}

      - name: Save next.js cargo target cache
        if: ${{ steps.next-target-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: next.js/target
          key: cargo-target-next-${{ matrix.sys }}-${{ env.CARGO_BUILD_TARGET }}-${{ hashFiles('next.js/Cargo.lock') }}

      - name: Save pnpm store
        if: ${{ steps.pnpm-store-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ matrix.sys }}-${{ hashFiles('next.js/pnpm-lock.yaml') }}
