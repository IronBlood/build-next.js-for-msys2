name: Build next.js with its dependencies

env:
  DEBUG: "napi:*"
  RUST_BACKTRACE: full
  # https://github.com/nodejs/node/issues/51555#issuecomment-2290742072
  DISABLE_V8_COMPILE_CACHE: 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "patches/**/*.patch"

jobs:
  build:
    env:
      NEXT_JS_REF: "v16.0.3"
      SWC_REF: "v1.11.24"
      DEBUG: "napi:*"
    strategy:
      fail-fast: false
      matrix:
        sys: [UCRT64]
    runs-on: ${{ matrix.sys == 'CLANGARM64' && 'windows-11-arm' || 'windows-latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: false
          install: >-
            git
            curl
          pacboy: >-
            toolchain:p
            cmake:p
            rustup:p
            nodejs:p
            ${{ (matrix.sys == 'CLANG64' || matrix.sys == 'CLANGARM64') && 'gcc-compat:p' || '' }}

      - name: Show working directory (Windows)
        shell: pwsh
        run: |
          Get-Location
          ls

      - name: Echo System Info
        shell: msys2 {0}
        run: |
          echo "MSYSTEM = $MSYSTEM"
          uname -a
          pacman -Q msys2-runtime || true
          pwd

      - name: Install Rust stable and locate rustc
        shell: msys2 {0}
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup toolchain install nightly-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain nightly-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustc_path="$(command -v rustc || true)"
          echo "rustc found at: ${rustc_path:-<not-found>}"
          if [ -n "$rustc_path" ]; then
            ls -l "$rustc_path"
            rustc -Vv || true
            rustc +nightly-x86_64-pc-windows-gnu -Vv || true
          else
            for prefix in /mingw64/bin /ucrt64/bin /clang64/bin /clangarm64/bin; do
              [ -d "$prefix" ] || continue
              echo "Listing rust binaries under $prefix"
              ls -la "$prefix" | grep rust || true
            done
          fi

      - name: Setup node
        shell: msys2 {0}
        run: |
          corepack enable

      - name: Build swc
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch $SWC_REF https://github.com/swc-project/swc
          cd swc
          yarn install
          export CARGO_PROFILE_RELEASE_LTO=false
          yarn build --target x86_64-pc-windows-gnu
